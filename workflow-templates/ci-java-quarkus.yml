# Starter workflow — CI backend Java/Quarkus
# Copiado para <produto>/.github/workflows/ no bootstrap.
# A lógica de build real vive em platform-standards (reusable workflow).
name: CI Backend (Quarkus)

# ADR-009: CI só em PR (não em push).
on:
  pull_request:
    branches: [develop]

jobs:
  call-platform:
    uses: fbso-techsolutions/platform-standards/.github/workflows/build-java-quarkus.yml@main
    with:
      java-version: "25"
