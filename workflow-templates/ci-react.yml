# Starter workflow — CI frontend React
# Copiado para <produto>/.github/workflows/ no bootstrap.
# A lógica de build real vive em platform-standards (reusable workflow).
name: CI Frontend (React)

# ADR-009: CI só em PR (não em push — o merge exige o status check do PR).
on:
  pull_request:
    branches: [develop]

jobs:
  call-platform:
    uses: fbso-techsolutions/platform-standards/.github/workflows/build-react.yml@main
